<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Name/Title</title>
		<meta property="og:site_name" content="Name/Title">
		<meta name="apple-mobile-web-app-title" content="Name/Title">
		<meta name="description" content="A sentence or two about yourself/brand.">
		<link rel="canonical" href="">
		<meta property="og:image" content="">
		<meta name="author" content="Indie Aisle">
		<link rel="me" href="https://indieaisle.com/@username">
		<link rel="icon" href="icon.svg" type="image/svg+xml">
		<link rel="icon" href="favicon.ico">
		<link rel="apple-touch-icon" href="appicon.png">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://indieaisle.com/pages-theme/style.css">
		<meta name="color-scheme" content="dark light">
	</head>
<body>

<!-- Header -->
<img src="https://fpoimg.com/1200x300?text=Banner" class="banner block-edit block-remove" data-block="header-banner">
<header class="container profile hcard block-region block-remove" data-group="header">
	<a href="#"><img src="https://fpoimg.com/180x180?text=Avatar" class="avatar block-region block-edit" data-group="header-avatar-type" data-block="header-avatar"></a>
	<a href="#"><img src="https://fpoimg.com/180x180?text=Avatar" class="avatar publication block-region block-edit" data-group="header-avatar-type" data-block="header-avatar"></a>
	<h3 class="p-name u-url block-edit" data-block="header-name"><a href="#">Name/Title</a></h3>
	<p class="block-edit block-remove" data-block="header-text">A sentence or two about yourself/brand.</p>
	<p><a href="#" class="btn-main block-edit" data-block="header-button">Follow updates</a></p>
</header>

<main class="container">

<!-- Menu section -->
	<section class="menu block-section" data-group="menu" data-title="Menu" style="text-align: center;">
		<ul class="block-region" data-group="menu-items">
			<li class="block-edit block-repeat" data-block="menu-item">Menu Item</li>
		</ul>
	</section>

<!-- Contact form -->
	<article class="block-section" data-group="contact" data-title="Contact form" style="margin-bottom: 20px;">
		<form id="contact" method="post" action="https://indieaisle.com/form/">
			<input type="hidden" id="enablesubmit" name="enablesubmit" value="">
			<input type="hidden" id="userthanks" name="userthanks" value="">
			<p><span class="block-edit" data-block="contact-text">Fill out the form below to reach me</span>:</p>
			<p>
				<label for="field-name" class="block-edit" data-block="field-name-label">Your name</label><br>
				<input id="field-name" size="50" maxlength="200" name="" class="block-edit" data-block="field-name-field" style="width: 100%;"><br>
				<label for="field-email" class="block-edit" data-block="field-email-label">Email address</label><br>
				<input id="field-email" size="50" maxlength="200" name="" required class="block-edit" data-block="field-email-field" type="email" style="width: 100%;"><br>
				<label for="field-comment" class="block-edit" data-block="field-comment-label">Question/comment</label><br>
				<textarea id="field-comment" cols="50" rows="5" name="" class="block-edit" data-block="field-comment-field" style="width: 100%;"></textarea><br>
				<button type="submit" class="btn-main">Submit</button>
			</p>
		</form>
		<!-- Indie Aisle - connect directly to your audience -->
		<script src="https://indieaisle.com/form/submit.js" defer></script>
		<!-- / Indie Aisle -->
	</article>

</main>

<footer class="container block-region block-remove" data-group="footer">
	<p class="block-edit" data-block="footer-text">An <a href="https://indieaisle.com" target="_blank">Indie Aisle</a> template. Built and edited with <a href="https://blocksedit.com" target="_blank">Blocks Edit</a>.</p>
</footer>

<!-- Indie Aisle - connect directly to your audience -->
<script src="https://indieaisle.com/stats/get.js"></script>
<!-- / Indie Aisle -->

</body>
</html>
